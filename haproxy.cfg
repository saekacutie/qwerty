global
    maxconn 65535
    log stdout format raw local0

defaults
    mode http
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s
    timeout tunnel  3600s
    option httplog

frontend main
    # Fix: 'proto h2c' accepts both HTTP/1.1 and cleartext HTTP/2 (gRPC) without crashing
    bind :8080 proto h2c

    # Health check
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # --- Anti-abuse rate limiting -------------------------------------------
    # Cloud Run terminates TLS/HTTP at Google's own frontend before this
    # container ever sees a packet, so the TCP "src" HAProxy would normally
    # key off of is always Google's frontend, not the real client. The real
    # client IP is the first hop in X-Forwarded-For, so that's what we track.
    # This limits abuse per real client but is NOT a substitute for
    # network-layer DDoS protection - for volumetric attacks, put Cloud
    # Armor in front of the service (see README note below).
    stick-table type ip size 200k expire 30s store conn_cur,conn_rate(10s),http_req_rate(10s)
    http-request set-var(txn.client_ip) req.hdr_ip(X-Forwarded-For)
    http-request track-sc0 var(txn.client_ip) unless is_health
    http-request deny deny_status 429 if !is_health { sc_conn_cur(0) gt 60 }
    http-request deny deny_status 429 if !is_health { sc_http_req_rate(0) gt 300 }

    # Trojan ACLs (Fix: Changed 'path' to 'path_beg' for gRPC/XHTTP sub-paths)
    acl path_trojan_ws path_beg /saeka-tojirp
    acl path_trojan_hu path_beg /saeka-tojirp-hu
    acl path_trojan_xh path_beg /saeka-tojirp-xh
    acl path_trojan_grpc path_beg /saeka-tojirp-grpc

    # VMess ACLs
    acl path_vmess_ws path_beg /vmess-saeka
    acl path_vmess_hu path_beg /vmess-saeka-hu
    acl path_vmess_xh path_beg /vmess-saeka-xh
    acl path_vmess_grpc path_beg /vmess-saeka-grpc

    # VLESS ACLs
    acl path_vless_ws path_beg /vless-saeka
    acl path_vless_hu path_beg /vless-saeka-hu
    acl path_vless_xh path_beg /vless-saeka-xh
    acl path_vless_grpc path_beg /vless-saeka-grpc

    # Shadowsocks ACLs
    acl path_ss_ws path_beg /ss-saeka
    acl path_ss_hu path_beg /ss-saeka-hu
    acl path_ss_xh path_beg /ss-saeka-xh
    acl path_ss_grpc path_beg /ss-saeka-grpc

    # SSH-over-WebSocket. NOTE: /saeka is a literal prefix of the trojan
    # path /saeka-tojirp - this ACL and its use_backend rule MUST stay
    # below every trojan rule below (HAProxy matches top-to-bottom, first
    # hit wins - it does not sort by prefix length), or SSH would steal
    # trojan's traffic.
    acl path_ssh path_beg /saeka

    # Backend Routing (Fix: Reordered longest match first to prevent prefix hijacking)
    use_backend bk_10012_grpc if path_trojan_grpc
    use_backend bk_10001 if path_trojan_hu
    use_backend bk_10002 if path_trojan_xh
    use_backend bk_10000 if path_trojan_ws

    use_backend bk_10013_grpc if path_vmess_grpc
    use_backend bk_10004 if path_vmess_hu
    use_backend bk_10005 if path_vmess_xh
    use_backend bk_10003 if path_vmess_ws

    use_backend bk_10014_grpc if path_vless_grpc
    use_backend bk_10007 if path_vless_hu
    use_backend bk_10008 if path_vless_xh
    use_backend bk_10006 if path_vless_ws

    use_backend bk_10015_grpc if path_ss_grpc
    use_backend bk_10010 if path_ss_hu
    use_backend bk_10011 if path_ss_xh
    use_backend bk_10009 if path_ss_ws

    # SSH must be last: it's the shortest/least specific prefix of the set
    use_backend bk_10016 if path_ssh

# Backends (HTTP/1.1 & WebSocket)
backend bk_10016
    server s1 127.0.0.1:10016
backend bk_10000
    server s1 127.0.0.1:10000
backend bk_10001
    server s1 127.0.0.1:10001
backend bk_10002
    server s1 127.0.0.1:10002
backend bk_10003
    server s1 127.0.0.1:10003
backend bk_10004
    server s1 127.0.0.1:10004
backend bk_10005
    server s1 127.0.0.1:10005
backend bk_10006
    server s1 127.0.0.1:10006
backend bk_10007
    server s1 127.0.0.1:10007
backend bk_10008
    server s1 127.0.0.1:10008
backend bk_10009
    server s1 127.0.0.1:10009
backend bk_10010
    server s1 127.0.0.1:10010
backend bk_10011
    server s1 127.0.0.1:10011

# Backends (gRPC - proto h2)
backend bk_10012_grpc
    server s1 127.0.0.1:10012 proto h2
backend bk_10013_grpc
    server s1 127.0.0.1:10013 proto h2
backend bk_10014_grpc
    server s1 127.0.0.1:10014 proto h2
backend bk_10015_grpc
    server s1 127.0.0.1:10015 proto h2

# NOTE: the rate limits above throttle abusive individual clients at the
# app layer. They do not and cannot stop a real volumetric/L3-L4 DDoS -
# that protection lives one layer up, at Google Cloud Armor (attach a
# security policy to the Cloud Run service's serverless NEG / load
# balancer). No app-layer config can honestly claim to stop that class
# of attack on its own.
