global
    maxconn 65535
    log stdout format raw local0

defaults
    mode http
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s
    timeout tunnel  3600s
    timeout http-request 10s
    option httplog

frontend main
    # FIXED: "proto h2c" is not a real HAProxy MUX protocol value (only
    # h1/h2/fcgi exist) - confirmed by your CI run. HAProxy also has no
    # ALPN-less auto-detection between HTTP/1.1 and cleartext HTTP/2 on a
    # single bind (that only works inside a TLS handshake via real ALPN,
    # which doesn't apply here since Cloud Run terminates TLS before this
    # container ever sees the traffic). This frontend is now HTTP/1.1 only;
    # for gRPC use Envoy or Caddy instead.
    bind :8080

    # --- Anti-DDoS: stick-table tracking connection rate per source IP ---
    # size 200k: tracks up to 200,000 distinct IPs at once
    # expire 30s: entries age out after 30s of inactivity
    stick-table type ip size 200k expire 30s store conn_rate(10s),http_req_rate(10s)
    tcp-request connection track-sc0 src

    # Reject outright if a single IP opens more than 100 connections in a
    # rolling 10s window, or fires more than 300 HTTP requests in 10s. This
    # is the "automatically stop serving an abusive client" mechanism -
    # once a source IP crosses either threshold every further request from
    # it gets a 429 until the stick-table entry ages out, no manual step.
    http-request deny status 429 if { sc_conn_rate(0) gt 100 }
    http-request deny status 429 if { sc_http_req_rate(0) gt 300 }

    # Health check
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # gRPC paths: return a clear error instead of forwarding to a backend
    # that would receive malformed protocol framing from an h1 frontend.
    acl path_any_grpc path_beg /saeka-tojirp-grpc /vmess-saeka-grpc /vless-saeka-grpc /ss-saeka-grpc
    http-request return status 501 content-type "text/plain" string "gRPC is not supported on the HAProxy engine here - HAProxy has no ALPN-less h1/h2c auto-detection on a cleartext bind. Use Envoy or Caddy for gRPC." if path_any_grpc

    # Trojan ACLs (longest match first to prevent prefix hijacking)
    acl path_trojan_hu path_beg /saeka-tojirp-hu
    acl path_trojan_xh path_beg /saeka-tojirp-xh
    acl path_trojan_ws path_beg /saeka-tojirp

    # VMess ACLs
    acl path_vmess_hu path_beg /vmess-saeka-hu
    acl path_vmess_xh path_beg /vmess-saeka-xh
    acl path_vmess_ws path_beg /vmess-saeka

    # VLESS ACLs
    acl path_vless_hu path_beg /vless-saeka-hu
    acl path_vless_xh path_beg /vless-saeka-xh
    acl path_vless_ws path_beg /vless-saeka

    # Shadowsocks ACLs
    acl path_ss_hu path_beg /ss-saeka-hu
    acl path_ss_xh path_beg /ss-saeka-xh
    acl path_ss_ws path_beg /ss-saeka

    # Backend Routing (longest match first)
    use_backend bk_10001 if path_trojan_hu
    use_backend bk_10002 if path_trojan_xh
    use_backend bk_10000 if path_trojan_ws

    use_backend bk_10004 if path_vmess_hu
    use_backend bk_10005 if path_vmess_xh
    use_backend bk_10003 if path_vmess_ws

    use_backend bk_10007 if path_vless_hu
    use_backend bk_10008 if path_vless_xh
    use_backend bk_10006 if path_vless_ws

    use_backend bk_10010 if path_ss_hu
    use_backend bk_10011 if path_ss_xh
    use_backend bk_10009 if path_ss_ws

    default_backend bk_404

backend bk_404
    http-request return status 404

# Backends (HTTP/1.1 & WebSocket)
backend bk_10000
    server s1 127.0.0.1:10000
backend bk_10001
    server s1 127.0.0.1:10001
backend bk_10002
    server s1 127.0.0.1:10002
backend bk_10003
    server s1 127.0.0.1:10003
backend bk_10004
    server s1 127.0.0.1:10004
backend bk_10005
    server s1 127.0.0.1:10005
backend bk_10006
    server s1 127.0.0.1:10006
backend bk_10007
    server s1 127.0.0.1:10007
backend bk_10008
    server s1 127.0.0.1:10008
backend bk_10009
    server s1 127.0.0.1:10009
backend bk_10010
    server s1 127.0.0.1:10010
backend bk_10011
    server s1 127.0.0.1:10011
