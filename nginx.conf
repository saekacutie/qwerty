worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    server_tokens off;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 3s;

    proxy_connect_timeout 10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Anti-DDoS: standard nginx rate/connection limiting ---
    # 30 req/s per IP baseline (bursts of 50 absorbed smoothly via nodelay),
    # plus a hard cap of 20 concurrent connections per IP. Requests beyond
    # the limit get an automatic 429/503 - no manual intervention needed for
    # the common flood case.
    limit_req_zone $binary_remote_addr zone=ddos_req:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=ddos_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        # FIXED: removed "http2 on;" here. nginx cannot serve HTTP/1.1 and
        # cleartext HTTP/2 on the same non-TLS listener - turning http2 on
        # made this whole server HTTP/2-only, which silently broke every
        # WS/httpupgrade/xhttp endpoint below (they need HTTP/1.1's Upgrade
        # mechanism). This engine now serves WS/httpupgrade/xhttp only -
        # for gRPC, use Envoy, Caddy, or Traefik instead, which do real
        # per-connection protocol detection (HAProxy was checked too and
        # can't either - see haproxy.cfg's comment).
        listen 8080 default_server backlog=4096;
        server_name _;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
            access_log off;
        }

        location = / {
            root /usr/local/openresty/nginx/html;
            index index.html;
            access_log off;
        }

        # --- TROJAN ENDPOINTS (Longest prefixes placed first with ^~ modifier) ---
        location ^~ /saeka-tojirp-hu {
            proxy_pass http://127.0.0.1:10001;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /saeka-tojirp-xh {
            proxy_pass http://127.0.0.1:10002;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /saeka-tojirp {
            proxy_pass http://127.0.0.1:10000;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- VMESS ENDPOINTS ---
        location ^~ /vmess-saeka-hu {
            proxy_pass http://127.0.0.1:10004;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vmess-saeka-xh {
            proxy_pass http://127.0.0.1:10005;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vmess-saeka {
            proxy_pass http://127.0.0.1:10003;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- VLESS ENDPOINTS ---
        location ^~ /vless-saeka-hu {
            proxy_pass http://127.0.0.1:10007;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vless-saeka-xh {
            proxy_pass http://127.0.0.1:10008;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /vless-saeka {
            proxy_pass http://127.0.0.1:10006;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # --- SHADOWSOCKS ENDPOINTS ---
        location ^~ /ss-saeka-hu {
            proxy_pass http://127.0.0.1:10010;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /ss-saeka-xh {
            proxy_pass http://127.0.0.1:10011;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /ss-saeka {
            proxy_pass http://127.0.0.1:10009;
            limit_req zone=ddos_req burst=50 nodelay;
            limit_conn ddos_conn 20;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # gRPC deliberately not routed here - see note at top of this file.
        location ~ ^/(saeka-tojirp|vmess-saeka|vless-saeka|ss-saeka)-grpc$ {
            return 501 "gRPC is not supported on the OpenResty/nginx engine (HTTP/1.1 + h2c cleartext cannot share one port on nginx). Select Envoy, Caddy, or Traefik for gRPC.\n";
            add_header Content-Type text/plain;
        }
    }
}
