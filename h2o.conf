listen: 8080

hosts:
  "default":
    paths:
      "/health":
        file.dir: /var/www/html

      # gRPC is intentionally NOT routed here. H2O's proxy.reverse.url
      # directive is documented as HTTP/1.1-only to upstreams - it cannot
      # speak the HTTP/2 framing Xray's gRPC inbound requires, the same
      # underlying limitation OpenResty/nginx has. An earlier version of
      # this file used a directive called "proxy.http2.force-cleartext"
      # to try to work around this - that directive does not exist in H2O,
      # and an unrecognized config key makes H2O refuse to start at all,
      # which is what was causing the crash. For gRPC, use Envoy or Caddy.

      "/saeka-tojirp-hu":
        proxy.reverse.url: "http://127.0.0.1:10001"
        proxy.websocket.enabled: ON
      "/saeka-tojirp-xh":
        proxy.reverse.url: "http://127.0.0.1:10002"
      "/saeka-tojirp":
        proxy.reverse.url: "http://127.0.0.1:10000"
        proxy.websocket.enabled: ON

      "/vmess-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10004"
        proxy.websocket.enabled: ON
      "/vmess-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10005"
      "/vmess-saeka":
        proxy.reverse.url: "http://127.0.0.1:10003"
        proxy.websocket.enabled: ON

      "/vless-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10007"
        proxy.websocket.enabled: ON
      "/vless-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10008"
      "/vless-saeka":
        proxy.reverse.url: "http://127.0.0.1:10006"
        proxy.websocket.enabled: ON

      "/ss-saeka-hu":
        proxy.reverse.url: "http://127.0.0.1:10010"
        proxy.websocket.enabled: ON
      "/ss-saeka-xh":
        proxy.reverse.url: "http://127.0.0.1:10011"
      "/ss-saeka":
        proxy.reverse.url: "http://127.0.0.1:10009"
        proxy.websocket.enabled: ON

access-log: /dev/stdout
error-log: /dev/stderr
